<title>Reef Runner — Coloring Page</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{
    --bg:#e9efec; --ink:#1c2a32; --ink-soft:#54666f; --accent:#0f8a7e;
    --fd:"Trebuchet MS","Segoe UI",system-ui,sans-serif;
    --fb:Verdana,Geneva,system-ui,sans-serif;
  }
  @media (prefers-color-scheme:dark){ :root{ --bg:#12201f; --ink:#e8f0ee; --ink-soft:#9fb3b1; } }
  :root[data-theme="dark"]{ --bg:#12201f; --ink:#e8f0ee; --ink-soft:#9fb3b1; }
  :root[data-theme="light"]{ --bg:#e9efec; --ink:#1c2a32; --ink-soft:#54666f; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--fb); }
  .bar{ max-width:820px; margin:0 auto; padding:16px 18px 6px; display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between; }
  .bar p{ margin:0; font-size:.86rem; color:var(--ink-soft); max-width:52ch; }
  .btn{ font-family:var(--fd); font-weight:700; background:var(--accent); color:#fff; border:0; border-radius:999px; padding:9px 18px; font-size:.9rem; cursor:pointer; }

  /* the printable white sheet */
  .sheet{
    background:#fff; color:#15202a; max-width:820px; margin:10px auto 40px;
    border-radius:12px; box-shadow:0 12px 40px rgba(20,40,45,.14); padding:26px 30px 20px;
  }
  .sheet .title{ font-family:var(--fd); font-weight:700; text-align:center; font-size:1.8rem; margin:0; color:#12463f; }
  .sheet .say{ text-align:center; font-family:var(--fb); font-size:.92rem; color:#4a5b63; margin:6px 0 4px; }
  .sheet .name{ font-family:var(--fd); font-weight:700; font-size:1rem; margin:10px 0 2px; color:#15202a; }
  .sheet .name span{ display:inline-block; border-bottom:2px solid #15202a; width:260px; }
  svg{ display:block; width:100%; height:auto; }

  @media print{
    @page{ size:Letter portrait; margin:10mm; }
    body{ background:#fff; }
    .bar{ display:none; }
    .sheet{ box-shadow:none; border-radius:0; margin:0; padding:0; max-width:none; }
  }
</style>

<div class="bar">
  <p>Print it and hand it out. The girls color the diver <b>Reef Runner</b> hero — then fill the reef with their own colors. A calm warm-up before the coding starts.</p>
  <button class="btn" onclick="window.print()">🖨 Print</button>
</div>

</div>

<script>
